{% extends 'base.html' %}
{% block title %}Record Sale{% endblock %}

{% block content %}

<div class="card p-4 shadow-sm">

    <h3>💰 Record Sale</h3>
    <p>Goat: <strong>{{ goat.tag_number }}</strong></p>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Date Sold</label>
            {{ form.date_sold }}
        </div>

        <div class="mb-3">
            <label>Sale Price</label>
            {{ form.sale_price }}
        </div>

        <button class="btn btn-warning">Save Sale</button>
        <a href="{% url 'goat_detail' goat.id %}" class="btn btn-secondary">Cancel</a>

    </form>

</div>

{% endblock %}
